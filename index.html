<script>
const data = [{"q": "బాల వికాసం (Child Development) అంటే ప్రధానంగా ఏమిటి?", "opts": ["పిల్లల శారీరక పెరుగుదల మాత్రమే", "పిల్లల శారీరక, మానసిక, సామాజిక, భావోద్వేగ, భాషా తదితర రంగాల అభివృద్ధి", "పరీక్ష మార్కుల పెరుగుదల మాత్రమే", "బరువు మరియు ఎత్తు మార్పులు మాత్రమే"], "ans": 1, "exp": "బాల వికాసం అనేది శారీరకంతో పాటు మానసిక, సామాజిక, భావోద్వేగ, భాషా మొదలైన అనేక రంగాల అభివృద్ధిని సూచిస్తుంది."}, {"q": "Growth మరియు Development మధ్య సరైన సంబంధం ఏది?", "opts": ["Growth అనేది Development కంటే విస్తృతమైనది", "Development కేవలం శారీరక మార్పులే", "Growth, Developmentలో ఒక భాగం; Development విస్తృతమైన భావన", "రెండూ పూర్తిగా ఒకటే"], "ans": 2, "exp": "Growth ప్రధానంగా పరిమాణాత్మక శారీరక మార్పులను సూచిస్తుంది; Development మరింత విస్తృతమైన పరిమాణాత్మక + గుణాత్మక మార్పులను కలిగి ఉంటుంది."}, {"q": "కింది వాటిలో Development యొక్క సరైన లక్షణం ఏది?", "opts": ["అది ఒకే వయస్సులో అందరికీ ఒకే విధంగా జరుగుతుంది", "అది నిరంతర మరియు క్రమబద్ధమైన ప్రక్రియ", "అది శారీరక రంగానికే పరిమితం", "అది పరీక్షల ద్వారా మాత్రమే తెలుస్తుంది"], "ans": 1, "exp": "వికాసం నిరంతరంగా, సాధారణంగా ఒక క్రమాన్ని అనుసరిస్తూ జరుగుతుంది; అయితే పిల్లల వేగంలో వ్యక్తిగత భేదాలు ఉంటాయి."}, {"q": "‘Simple → Complex’ అనే వికాస సూత్రం ఏమి సూచిస్తుంది?", "opts": ["సంక్లిష్ట నైపుణ్యాలకు ముందు సరళమైన నైపుణ్యాలు పునాది అవుతాయి", "అన్ని పిల్లలు ఒకే వేగంతో నేర్చుకుంటారు", "వికాసం ఆగిపోతుంది", "పర్యావరణం ప్రభావం ఉండదు"], "ans": 0, "exp": "సరళమైన నైపుణ్యాలు తరువాత అభివృద్ధి చెందే సంక్లిష్ట నైపుణ్యాలకు పునాదిగా పనిచేస్తాయి."}, {"q": "కింది వాటిలో జ్ఞానాత్మక (Cognitive) వికాసానికి చెందినది ఏది?", "opts": ["ఎత్తు", "జ్ఞాపకం మరియు తర్కం", "బరువు", "కండరాల బలం"], "ans": 1, "exp": "ఆలోచన, జ్ఞాపకం, తర్కం, సమస్య పరిష్కారం వంటి అంశాలు జ్ఞానాత్మక వికాసంలో భాగాలు."}, {"q": "కింది వాటిలో సామాజిక వికాసానికి సరైన ఉదాహరణ ఏది?", "opts": ["ఎత్తు పెరగడం", "స్నేహితులతో సహకరించడం", "జ్ఞాపకశక్తి పెరగడం", "చదవడం నేర్చుకోవడం"], "ans": 1, "exp": "సహకారం, సంభాషణ, స్నేహ సంబంధాలు సామాజిక వికాసానికి సంబంధించినవి."}, {"q": "వికాసాన్ని ప్రభావితం చేసే ముఖ్యమైన రెండు అ      item.opts.forEach((o,j)=>{
       const checked=selected[i]===j?'checked':'';
       opts+=`<label class="option"><input type="radio" name="q${i}" value="${j}" ${checked} onchange="selected[${i}]=${j}">${String.fromCharCode(65+j)}. ${o}</label>`;
     });
     div.innerHTML+=`<div class="card"><div class="q">${i+1}. ${item.q}</div>${opts}</div>`;
   }
   const actions=document.createElement('div'); actions.className='actions';
   actions.innerHTML = page>0 ? `<button class="action secondary" onclick="showPage(${page-1})">← PREVIOUS</button>` : `<span></span>`;
   actions.innerHTML += page<2 ? `<button class="action" onclick="showPage(${page+1})">NEXT 10 →</button>` : `<span></span>`;
   div.appendChild(actions); quiz.appendChild(div);
 }
}
function showPage(p){
 current=p;
 document.querySelectorAll('.page').forEach((x,i)=>x.classList.toggle('active',i===p));
 document.querySelectorAll('.setbtn').forEach((x,i)=>x.classList.toggle('active',i===p));
 document.getElementById('count').textContent=(p*10+1)+'–'+(p*10+10)+' / 30';
 document.getElementById('bar').style.width=((p+1)*33.333)+'%';
 window.scrollTo({top:0,behavior:'smooth'});
}
function submitTest(){
 let score=0, answered=0;
 selected.forEach((v,i)=>{if(v!==null) answered++; if(v===data[i].ans) score++;});
 let out=`<div class="score">మీ స్కోర్: ${score} / 30</div>`;
 out+=`<p style="text-align:center"><b>Answered:</b> ${answered} / 30 &nbsp; | &nbsp; <b>Not Answered:</b> ${30-answered}</p>`;
 out+=`<div class="review"><h3>Correct Choices & Explanations</h3>`;
 data.forEach((item,i)=>{
   const chosen=selected[i];
   const ok=chosen===item.ans;
   out+=`<div style="padding:10px 0;border-bottom:1px solid #eee">
   <b>${i+1}. ${item.q}</b><br>
   <span class="${ok?'correct':'wrong'}">${ok?'✓ Correct':'✗ Incorrect / Not Answered'}</span><br>
   <b>Correct Choice: ${String.fromCharCode(65+item.ans)}. ${item.opts[item.ans]}</b>
   ${chosen!==null && !ok ? `<br>Your Choice: ${String.fromCharCode(65+chosen)}. ${item.opts[chosen]}` : ''}
   <div class="explain">${item.exp}</div>
   </div>`;
 });
 out+=`</div>`;
 const r=document.getElementById('result'); r.innerHTML=out; r.style.display='block';
 r.scrollIntoView({behavior:'smooth'});
}
render();
</script>
</body>
</html>
